name: Fortify ScanCentral SAST Scan
on:


  workflow_dispatch:
  push:
    # Master or main branch that you want to trigger this workflow for
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]

jobs:                                                  
  Fortify-SAST:
    # Use the appropriate runner for building your source code
    runs-on: self-hosted 
    steps:


          
      # Check out source code
      - name: Check Out Source Code
        uses: actions/checkout@v4
        with:
          path: '' 
          # Fetch at least the immediate parents so that if this is a pull request then we can checkout the head.
          fetch-depth: 2
      # If this run was triggered by a pull request event, then checkout the head of the pull request instead of the merge commit.
      - run: git checkout HEAD^2
        if: ${{ github.event_name == 'pull_request' }} 




 

      # 2. Fetch the changed files
      - name: Get modified files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Output files list securely using correct PowerShell loops
      - name: List all changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          Write-Output "The following files changed:"
          $files = "${{ steps.changed-files.outputs.all_changed_files }}" -split " "
          foreach ($file in $files) {
              # Write-Output $file
              if (-not [string]::IsNullOrWhiteSpace($file)) {
              Write-Output "Including changed file: $file"

              $includeArgs += "-include"
            $includeArgs += "./$file"
          }
          Write-Output "Including changed file 22222: $includeArgs"
          }

        

      # Java is required to run ScanCentral Client, and may be required for your build
      # Java version to use depends on the Java version required to run your build (if any),
      # and the Java version supported by the ScanCentral Client version that you are running
      - name: Setup Java
        uses: actions/setup-java@v1
        with:
          java-version: 17
      
      ### Set up Fortify ScanCentral Client ###
      - name: Fortify ScanCentral Scan
        uses: fortify/gha-setup-scancentral-client@v2.3.0
   
        with:
          version: 24.2.0                                      # On-prem customers should specify a client version that matches their ScanCentral environment
                                                               # FoD customers usually should not specify a version but rather rely on the default version
          client-auth-token: ${{ secrets.CLIENT_AUTH_TOKEN }}  # Optional, but required if ScanCentral Controller requires client authentication

      ### Run Fortify ScanCentral Client ###
      # Update BUILD_OPTS based on the ScanCentral Client documentation and your project's included tech stack(s).
      #   ScanCentral Client will download dependencies for maven, gradle and msbuild projects.
      #   For other build tools, add your build commands to the workflow to download necessary dependencies and prepare according to Fortify SCA documentation.
      - name: Stage full project and run Fortify ScanCentral SAST
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: powershell
        env:
          SSC_URL: ${{ secrets.SSC_URL }}
          SSC_CI_TOKEN: ${{ secrets.SSC_CI_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_SAST_TOKEN }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      
        run: |
          $ErrorActionPreference = "Stop"
      
          $workspace = $env:GITHUB_WORKSPACE
          $stagingDir = Join-Path $env:RUNNER_TEMP "fortify-full-project"
          $packageFile = Join-Path $env:RUNNER_TEMP "package.zip"
      
          # ---------------------------------------------------------
          # 1. Process changed files
          # ---------------------------------------------------------
      
          Write-Host "Changed files that triggered this workflow:"
          Write-Host $env:CHANGED_FILES
      
          if ([string]::IsNullOrWhiteSpace($env:CHANGED_FILES)) {
              Write-Host "No changed files. Skipping Fortify scan."
              exit 0
          }
      
          $changedFiles = @(
              $env:CHANGED_FILES -split '\|' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
      
          Write-Host ""
          Write-Host "Changed files:"
      
          foreach ($file in $changedFiles) {
              Write-Host "  $file"
          }
      
          # ---------------------------------------------------------
          # 2. Prepare clean staging directory
          # ---------------------------------------------------------
      
          Write-Host ""
          Write-Host "Preparing staging directory:"
          Write-Host $stagingDir
      
          if (Test-Path -LiteralPath $stagingDir) {
              Remove-Item -LiteralPath $stagingDir -Recurse -Force
          }
      
          New-Item `
              -ItemType Directory `
              -Path $stagingDir `
              -Force | Out-Null
      
          # ---------------------------------------------------------
          # 3. Copy FULL source tree
          #
          # Important for Java/.NET/C/C++:
          # We copy the complete project, NOT only changed files.
          # ---------------------------------------------------------
      
          Write-Host ""
          Write-Host "Copying complete project for compiled-language analysis..."
      
          $robocopyArgs = @(
              $workspace
              $stagingDir
              "/E"
              "/R:2"
              "/W:2"
              "/XD"
              ".git"
              ".vs"
              ".idea"
              ".gradle"
              "node_modules"
              "bin"
              "obj"
              "target"
              "build"
              "dist"
              "coverage"
              "/XF"
              "package.zip"
              "*.fpr"
              "*.log"
          )
      
          & robocopy @robocopyArgs
      
          $robocopyExitCode = $LASTEXITCODE
      
          Write-Host "Robocopy exit code: $robocopyExitCode"
      
          # Robocopy 0-7 = success/nonfatal
          # Robocopy >=8 = failure
          if ($robocopyExitCode -ge 8) {
              throw "Repository staging failed. Robocopy exit code: $robocopyExitCode"
          }
      
          Write-Host "Full repository staging completed."
      
          # ---------------------------------------------------------
          # 4. Remove previous package
          # ---------------------------------------------------------
      
          if (Test-Path -LiteralPath $packageFile) {
              Remove-Item -LiteralPath $packageFile -Force
          }
      
          # ---------------------------------------------------------
          # 5. Detect build system
          # ---------------------------------------------------------
      
          $mavenFile = Get-ChildItem `
              -Path $stagingDir `
              -Filter "pom.xml" `
              -File `
              -Recurse |
              Select-Object -First 1
      
          $gradleFile = Get-ChildItem `
              -Path $stagingDir `
              -File `
              -Recurse |
              Where-Object {
                  $_.Name -eq "build.gradle" -or
                  $_.Name -eq "build.gradle.kts"
              } |
              Select-Object -First 1
      
          $solution = Get-ChildItem `
              -Path $stagingDir `
              -Filter "*.sln" `
              -File `
              -Recurse |
              Select-Object -First 1
      
          Write-Host ""
          Write-Host "Build system detection:"
      
          if ($mavenFile) {
              Write-Host "Maven project detected:"
              Write-Host $mavenFile.FullName
          }
          elseif ($gradleFile) {
              Write-Host "Gradle project detected:"
              Write-Host $gradleFile.FullName
          }
          elseif ($solution) {
              Write-Host "MSBuild project detected:"
              Write-Host $solution.FullName
          }
          else {
              Write-Host "No Maven, Gradle or MSBuild project detected."
              Write-Host "ScanCentral automatic project detection will be used."
          }
      
          # ---------------------------------------------------------
          # 6. Package complete project
          # ---------------------------------------------------------
      
          Push-Location $stagingDir
      
          try {
      
              Write-Host ""
              Write-Host "Creating ScanCentral package..."
      
              if ($mavenFile) {
      
                  $relativeBuildFile = $mavenFile.FullName.Substring(
                      $stagingDir.Length
                  ).TrimStart('\')
      
                  Write-Host "Build tool: Maven"
                  Write-Host "Build file: $relativeBuildFile"
      
                  & scancentral package `
                      -bt mvn `
                      -bf "$relativeBuildFile" `
                      -o "$packageFile"
              }
              elseif ($gradleFile) {
      
                  $relativeBuildFile = $gradleFile.FullName.Substring(
                      $stagingDir.Length
                  ).TrimStart('\')
      
                  Write-Host "Build tool: Gradle"
                  Write-Host "Build file: $relativeBuildFile"
      
                  & scancentral package `
                      -bt gradle `
                      -bf "$relativeBuildFile" `
                      -o "$packageFile"
              }
              elseif ($solution) {
      
                  $relativeBuildFile = $solution.FullName.Substring(
                      $stagingDir.Length
                  ).TrimStart('\')
      
                  Write-Host "Build tool: MSBuild"
                  Write-Host "Build file: $relativeBuildFile"
      
                  & scancentral package `
                      -bt msbuild `
                      -bf "$relativeBuildFile" `
                      -o "$packageFile"
              }
              else {
      
                  Write-Host "Using ScanCentral automatic detection."
      
                  & scancentral package `
                      -o "$packageFile"
              }
      
              $packageExitCode = $LASTEXITCODE
      
              if ($packageExitCode -ne 0) {
                  throw "ScanCentral package failed. Exit code: $packageExitCode"
              }
          }
          finally {
              Pop-Location
          }
                # ---------------------------------------------------------
          # 7. Validate package
          # ---------------------------------------------------------
          
          if (-not (Test-Path -LiteralPath $packageFile)) {
              throw "ScanCentral package was not created: $packageFile"
          }
          
          $packageInfo = Get-Item -LiteralPath $packageFile
          
          $packageSizeMB = [Math]::Round(
              $packageInfo.Length / 1MB,
              2
          )
          
          Write-Host ""
          Write-Host "Package successfully created."
          Write-Host "Package: $packageFile"
          Write-Host "Package size: $packageSizeMB MB"
          
          # ---------------------------------------------------------
          # 8. Check credentials
          # ---------------------------------------------------------
          
          if ([string]::IsNullOrWhiteSpace($env:SSC_URL)) {
              throw "SSC_URL is empty."
          }
          
          if ([string]::IsNullOrWhiteSpace($env:SSC_CI_TOKEN)) {
              throw "SSC_CI_TOKEN is empty."
          }
          
          if ([string]::IsNullOrWhiteSpace($env:SC_SAST_TOKEN)) {
              throw "SC_SAST_TOKEN is empty."
          }
          
          # ---------------------------------------------------------
          # 9. Login to SSC / ScanCentral
          # ---------------------------------------------------------
          
          Write-Host ""
          Write-Host "Logging in to SSC and configuring ScanCentral authentication..."
          
          & fcli ssc session login `
              --url "$env:SSC_URL" `
              #--ci-token "$env:SSC_CI_TOKEN" `
              -u sscadmin
              -p P@ssw0rd@123
              -c "$env:SC_SAST_TOKEN"
          
          if ($LASTEXITCODE -ne 0) {
              throw "fcli SSC session login failed. Exit code: $LASTEXITCODE"
          }
          
          # ---------------------------------------------------------
          # 10. Submit ONE ScanCentral SAST job
          # ---------------------------------------------------------
          
          Write-Host ""
          Write-Host "Submitting ScanCentral SAST scan..."
          
          & fcli sc-sast scan start `
              --file="$packageFile" `
              --publish-to "fcli:1" `
              --publish-token "$env:SSC_CI_TOKEN"
          
          if ($LASTEXITCODE -ne 0) {
              throw "ScanCentral scan submission failed. Exit code: $LASTEXITCODE"
          }
          
          Write-Host ""
          Write-Host "ScanCentral SAST scan submitted successfully."

    
      ### Archive ScanCentral Client logs on failure ###
      - name: Save ScanCentral Logs
        uses: actions/upload-artifact@v4                
        if: failure()
        with:
           name: scancentral-logs
           path: ~/.fortify/scancentral/log
