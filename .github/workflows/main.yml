name: Fortify ScanCentral SAST - Changed Files Only


on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Fortify-SAST:
    runs-on: self-hosted

    steps:
      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Check Out Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. IDENTIFY ALL CHANGED FILES
      # ============================================================

      - name: Get Changed Files
        id: changed-files
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $changedFilesPath = Join-Path `
              $env:RUNNER_TEMP `
              "fortify-changed-files.txt"

          if (Test-Path -LiteralPath $changedFilesPath) {
              Remove-Item `
                  -LiteralPath $changedFilesPath `
                  -Force
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DETECTING CHANGED FILES"
          Write-Host "=============================================="
          Write-Host "Event: $env:EVENT_NAME"

          $changedFiles = @()

          if ($env:EVENT_NAME -eq "pull_request") {
              if (
                  [string]::IsNullOrWhiteSpace($env:PR_BASE_SHA) -or
                  [string]::IsNullOrWhiteSpace($env:PR_HEAD_SHA)
              ) {
                  throw "Pull request base SHA or head SHA is empty."
              }

              Write-Host "PR base SHA: $env:PR_BASE_SHA"
              Write-Host "PR head SHA: $env:PR_HEAD_SHA"

              $changedFiles = @(
                  git diff `
                      --name-only `
                      --diff-filter=ACMRT `
                      "$env:PR_BASE_SHA...$env:PR_HEAD_SHA"
              )
          }
          elseif ($env:EVENT_NAME -eq "push") {
              $emptySha = "0000000000000000000000000000000000000000"

              Write-Host "Before SHA : $env:BEFORE_SHA"
              Write-Host "Current SHA: $env:CURRENT_SHA"

              if (
                  [string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -or
                  $env:BEFORE_SHA -eq $emptySha
              ) {
                  Write-Host "Before SHA is unavailable."
                  Write-Host "Comparing HEAD^ with HEAD."

                  $changedFiles = @(
                      git diff `
                          --name-only `
                          --diff-filter=ACMRT `
                          "HEAD^" `
                          "HEAD"
                  )
              }
              else {
                  $changedFiles = @(
                      git diff `
                          --name-only `
                          --diff-filter=ACMRT `
                          $env:BEFORE_SHA `
                          $env:CURRENT_SHA
                  )
              }
          }
          else {
              Write-Host "Manual workflow execution."
              Write-Host "Comparing HEAD^ with HEAD."

              $changedFiles = @(
                  git diff `
                      --name-only `
                      --diff-filter=ACMRT `
                      "HEAD^" `
                      "HEAD"
              )
          }

          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
              throw "git diff failed. Exit code: $gitExitCode"
          }

          $changedFiles = @(
              $changedFiles |
              ForEach-Object {
                  $_.Trim()
              } |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              } |
              Select-Object -Unique
          )

          if ($changedFiles.Count -eq 0) {
              New-Item `
                  -ItemType File `
                  -Path $changedFilesPath `
                  -Force |
                  Out-Null

              "any_changed=false" |
                  Out-File `
                      -FilePath $env:GITHUB_OUTPUT `
                      -Encoding utf8 `
                      -Append

              Write-Host "No changed files were detected."
          }
          else {
              $changedFiles |
                  Set-Content `
                      -LiteralPath $changedFilesPath `
                      -Encoding UTF8

              "any_changed=true" |
                  Out-File `
                      -FilePath $env:GITHUB_OUTPUT `
                      -Encoding utf8 `
                      -Append

              Write-Host ""
              Write-Host "Changed files detected: $($changedFiles.Count)"
              Write-Host ""

              foreach ($file in $changedFiles) {
                  Write-Host "Changed: $file"
              }
          }

          Write-Host ""
          Write-Host "Changed-files list: $changedFilesPath"

      # ============================================================
      # 3. DISPLAY CHANGED FILES
      # ============================================================

      - name: Display Changed Files
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $changedFilesPath = Join-Path `
              $env:RUNNER_TEMP `
              "fortify-changed-files.txt"

          if (-not (
              Test-Path `
                  -LiteralPath $changedFilesPath `
                  -PathType Leaf
          )) {
              throw "Changed-files list was not found: $changedFilesPath"
          }

          $changedFiles = @(
              Get-Content -LiteralPath $changedFilesPath |
              ForEach-Object {
                  $_.Trim()
              } |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              } |
              Select-Object -Unique
          )

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " ALL CHANGED FILES"
          Write-Host "=============================================="
          Write-Host "Number of changed files: $($changedFiles.Count)"
          Write-Host ""

          foreach ($file in $changedFiles) {
              Write-Host "Changed: $file"
          }

      # ============================================================
      # 4. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. SETUP FORTIFY SCANCENTRAL CLIENT
      # ============================================================

      - name: Setup Fortify ScanCentral Client
        uses: fortify/gha-setup-scancentral-client@v2.3.0
        with:
          version: "24.2.0"
          client-auth-token: ${{ secrets.CLIENT_AUTH_TOKEN }}

      # ============================================================
      # 6. PACKAGE ALL CHANGED FILES AND SUBMIT SCAN
      # ============================================================

      - name: Package Changed Files and Run Fortify ScanCentral SAST
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: powershell
        env:
          SSC_URL: ${{ secrets.SSC_URL }}
          SSC_USER: ${{ secrets.SSC_USER }}
          SSC_PASSWORD: ${{ secrets.SSC_PASSWORD }}
          SSC_CI_TOKEN: ${{ secrets.SSC_CI_TOKEN }}
          SC_SAST_TOKEN: ${{ secrets.SC_SAST_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          # ========================================================
          # CONFIGURATION
          # ========================================================

          $workspace = $env:GITHUB_WORKSPACE
          $stagingDir = Join-Path `
              $env:RUNNER_TEMP `
              "fortify-changed-files"
          $packageFile = Join-Path `
              $env:RUNNER_TEMP `
              "package.zip"
          $changedFilesPath = Join-Path `
              $env:RUNNER_TEMP `
              "fortify-changed-files.txt"

          $sscLoggedIn = $false

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FORTIFY CHANGED-FILE SCAN"
          Write-Host "=============================================="
          Write-Host "Workspace         : $workspace"
          Write-Host "Changed-files list: $changedFilesPath"
          Write-Host "Staging directory : $stagingDir"
          Write-Host "Package           : $packageFile"

          # ========================================================
          # 1. VALIDATE REQUIRED COMMANDS
          # ========================================================

          if ($null -eq (
              Get-Command scancentral -ErrorAction SilentlyContinue
          )) {
              throw "The scancentral command was not found in PATH."
          }

          if ($null -eq (
              Get-Command fcli -ErrorAction SilentlyContinue
          )) {
              throw "The fcli command was not found in PATH."
          }

          Write-Host ""
          Write-Host "ScanCentral Client and fcli are available."

          # ========================================================
          # 2. LOAD ALL CHANGED FILES
          # ========================================================

          if (-not (
              Test-Path `
                  -LiteralPath $changedFilesPath `
                  -PathType Leaf
          )) {
              throw "Changed-files list was not found: $changedFilesPath"
          }

          $changedFiles = @(
              Get-Content -LiteralPath $changedFilesPath |
              ForEach-Object {
                  $_.Trim()
              } |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              } |
              Select-Object -Unique
          )

          if ($changedFiles.Count -eq 0) {
              Write-Host "No valid changed files were found."
              Write-Host "Skipping Fortify scan."
              exit 0
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CHANGED FILES LOADED FOR PACKAGING"
          Write-Host "=============================================="
          Write-Host "Changed-file count: $($changedFiles.Count)"
          Write-Host ""

          foreach ($file in $changedFiles) {
              Write-Host "  $file"
          }

          # ========================================================
          # 3. PREPARE STAGING DIRECTORY
          # ========================================================

          Write-Host ""
          Write-Host "Preparing staging directory..."

          if (Test-Path -LiteralPath $stagingDir) {
              Remove-Item `
                  -LiteralPath $stagingDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $stagingDir `
              -Force |
              Out-Null

          if (Test-Path -LiteralPath $packageFile) {
              Remove-Item `
                  -LiteralPath $packageFile `
                  -Force
          }

          # ========================================================
            # 4. COPY ALL CHANGED FILES
            # ========================================================

            Write-Host ""
            Write-Host "=============================================="
            Write-Host " COPYING ALL CHANGED FILES"
            Write-Host "=============================================="

            # Use standard PowerShell arrays for maximum PS 5.1 compatibility
            $copiedFiles = @()
            $skippedFiles = @()

            foreach ($relativeFile in $changedFiles) {

                if (:IsNullOrWhiteSpace($relativeFile)) {
                    continue
                }

                $relativeFile = $relativeFile.Trim()

                # Convert GitHub/Git path separators to Windows separators
                $normalizedRelativeFile = $relativeFile.Replace(
                    "/",
                    "\"
                )

                # Reject absolute paths
                if () {
                    Write-Warning "Skipping absolute path: $relativeFile"
                    $skippedFiles += $relativeFile
                    continue
                }

                # Reject directory traversal
                if ($normalizedRelativeFile -match '(^|[\\])\.\.([\\]|$)') {
                    Write-Warning "Skipping unsafe path: $relativeFile"
                    $skippedFiles += $relativeFile
                    continue
                }

                $sourcePath = Join-Path `
                    $workspace `
                    $normalizedRelativeFile

                $destinationPath = Join-Path `
                    $stagingDir `
                    $normalizedRelativeFile

                Write-Host ""
                Write-Host "Processing : $relativeFile"
                Write-Host "Source     : $sourcePath"
                Write-Host "Destination: $destinationPath"

                # File must exist in current checkout
                if (-not (
                    Test-Path `
                        -LiteralPath $sourcePath `
                        -PathType Leaf
                )) {
                    Write-Warning "Skipping missing/deleted file: $relativeFile"

                    $skippedFiles += $relativeFile

                    continue
                }

                $destinationParent = Split-Path `
                    -Path $destinationPath `
                    -Parent

                if (-not (
                    Test-Path -LiteralPath $destinationParent
                )) {
                    New-Item `
                        -ItemType Directory `
                        -Path $destinationParent `
                        -Force |
                        Out-Null
                }

                Copy-Item `
                    -LiteralPath $sourcePath `
                    -Destination $destinationPath `
                    -Force

                # Verify copy actually succeeded
                if (-not (
                    Test-Path `
                        -LiteralPath $destinationPath `
                        -PathType Leaf
                )) {
                    throw "File copy failed: $relativeFile"
                }

                $copiedFiles += $relativeFile

                Write-Host "Included   : $relativeFile"
            }

            # ========================================================
            # 5. VERIFY COPIED FILES
            # ========================================================

            Write-Host ""
            Write-Host "=============================================="
            Write-Host " COPY SUMMARY"
            Write-Host "=============================================="

            Write-Host "Changed files detected : $($changedFiles.Count)"
            Write-Host "Changed files copied   : $($copiedFiles.Count)"
            Write-Host "Files skipped          : $($skippedFiles.Count)"

            if ($copiedFiles.Count -eq 0) {
                Write-Host ""
                Write-Host "No existing changed files are available to scan."
                Write-Host "Skipping Fortify scan."

                exit 0
            }

            if ($skippedFiles.Count -gt 0) {

                Write-Host ""
                Write-Host "Skipped files:"

                foreach ($file in $skippedFiles) {
                    Write-Host "  $file"
                }
            }

            # ========================================================
            # 6. DISPLAY FINAL STAGING CONTENTS
            # PowerShell 5.1 compatible
            # ========================================================

            Write-Host ""
            Write-Host "=============================================="
            Write-Host " FINAL FILES GOING INTO PACKAGE"
            Write-Host "=============================================="

            $stagedFiles = @(
                Get-ChildItem `
                    -LiteralPath $stagingDir `
                    -File `
                    -Recurse
            )

            foreach ($stagedFile in $stagedFiles) {

                Write-Host "  $($stagedFile.FullName)"
            }

            Write-Host ""
            Write-Host "Files copied     : $($copiedFiles.Count)"
            Write-Host "Files in staging : $($stagedFiles.Count)"

            if ($stagedFiles.Count -ne $copiedFiles.Count) {

                throw "Staging validation failed. Copied $($copiedFiles.Count) files but staging contains $($stagedFiles.Count) files."

            }
          # ========================================================
          # 7. CREATE SCANCENTRAL PACKAGE
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING SCANCENTRAL PACKAGE"
          Write-Host "=============================================="

          Push-Location $stagingDir

          try {
              $packageArguments = @(
                  "package"
                  "-o"
                  $packageFile
              )

              & scancentral @packageArguments
              $packageExitCode = $LASTEXITCODE

              if ($packageExitCode -ne 0) {
                  throw "ScanCentral package creation failed. Exit code: $packageExitCode"
              }
          }
          finally {
              Pop-Location
          }

          # ========================================================
          # 8. VALIDATE PACKAGE
          # ========================================================

          if (-not (
              Test-Path `
                  -LiteralPath $packageFile `
                  -PathType Leaf
          )) {
              throw "ScanCentral package was not created: $packageFile"
          }

          $packageInfo = Get-Item -LiteralPath $packageFile

          if ($null -eq $packageInfo) {
              throw "Unable to retrieve package information: $packageFile"
          }

          if ($packageInfo.Length -le 0) {
              throw "ScanCentral created an empty package: $packageFile"
          }

          $packageSizeBytes = [long]$packageInfo.Length
          $packageSizeKB = :Round(
              ($packageSizeBytes / 1KB),
              2
          )
          $packageSizeMB = :Round(
              ($packageSizeBytes / 1MB),
              2
          )

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " PACKAGE CREATED SUCCESSFULLY"
          Write-Host "=============================================="
          Write-Host "Package       : $packageFile"
          Write-Host "Size          : $packageSizeKB KB"
          Write-Host "Size in MB    : $packageSizeMB MB"
          Write-Host "Size in bytes : $packageSizeBytes"
          Write-Host "Changed files : $($copiedFiles.Count)"
          Write-Host "Skipped files : $($skippedFiles.Count)"

          # Optional diagnostic copy for the self-hosted runner.
          $diagnosticDirectory = "C:\temp"

          if (-not (
              Test-Path -LiteralPath $diagnosticDirectory
          )) {
              New-Item `
                  -ItemType Directory `
                  -Path $diagnosticDirectory `
                  -Force |
                  Out-Null
          }

          $diagnosticPackage = Join-Path `
              $diagnosticDirectory `
              "package.zip"

          Copy-Item `
              -LiteralPath $packageFile `
              -Destination $diagnosticPackage `
              -Force

          Write-Host "Diagnostic copy: $diagnosticPackage"

          # ========================================================
          # 9. VALIDATE FORTIFY CREDENTIALS
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VALIDATING FORTIFY CREDENTIALS"
          Write-Host "=============================================="

          if (:IsNullOrWhiteSpace($env:SSC_URL)) {
              throw "SSC_URL secret is empty."
          }

          if (:IsNullOrWhiteSpace($env:SSC_USER)) {
              throw "SSC_USER secret is empty."
          }

          if (:IsNullOrWhiteSpace($env:SSC_PASSWORD)) {
              throw "SSC_PASSWORD secret is empty."
          }

          if (:IsNullOrWhiteSpace($env:SSC_CI_TOKEN)) {
              throw "SSC_CI_TOKEN secret is empty."
          }

          if (:IsNullOrWhiteSpace($env:SC_SAST_TOKEN)) {
              throw "SC_SAST_TOKEN secret is empty."
          }

              Write-Host "All required Fortify credentials are present."

          # ========================================================
          # 10. LOGIN AND SUBMIT SCANCENTRAL SAST SCAN
          # ========================================================

          try {
              Write-Host ""
              Write-Host "=============================================="
              Write-Host " LOGIN TO SSC AND SCANCENTRAL"
              Write-Host "=============================================="

              $loginArguments = @(
                  "ssc"
                  "session"
                  "login"
                  "--url"
                  $env:SSC_URL
                  "-u"
                  $env:SSC_USER
                  "-p"
                  $env:SSC_PASSWORD
                  "-c"
                  $env:SC_SAST_TOKEN
              )

              & fcli @loginArguments
              $loginExitCode = $LASTEXITCODE

              if ($loginExitCode -ne 0) {
                  throw "fcli SSC login failed. Exit code: $loginExitCode"
              }

              $sscLoggedIn = $true

              Write-Host "SSC and ScanCentral login successful."

              Write-Host ""
              Write-Host "=============================================="
              Write-Host " SUBMITTING SCANCENTRAL SAST SCAN"
              Write-Host "=============================================="
              Write-Host "Package: $packageFile"
              Write-Host ""
              Write-Host "Files included in this scan:"

              foreach ($file in $copiedFiles) {
                  Write-Host "  $file"
              }

              Write-Host ""
              Write-Host "Submitting scan..."

              $scanArguments = @(
                  "sc-sast"
                  "scan"
                  "start"
                  "--file"
                  $packageFile
                  "--publish-to"
                  "fcli:1"
                  "--publish-token"
                  $env:SSC_CI_TOKEN
              )

              & fcli @scanArguments
              $scanExitCode = $LASTEXITCODE

              if ($scanExitCode -ne 0) {
                  throw "ScanCentral SAST scan submission failed. Exit code: $scanExitCode"
              }

              Write-Host ""
              Write-Host "=============================================="
              Write-Host " FORTIFY SCAN SUBMITTED SUCCESSFULLY"
              Write-Host "=============================================="
              Write-Host "Files detected : $($changedFiles.Count)"
              Write-Host "Files packaged : $($copiedFiles.Count)"
              Write-Host "Package        : $packageFile"
              Write-Host ""
              Write-Host "ScanCentral SAST job submitted successfully."
          }
          finally {
              if ($sscLoggedIn) {
                  Write-Host ""
                  Write-Host "Logging out from SSC..."

                  & fcli ssc session logout
                  $logoutExitCode = $LASTEXITCODE

                  if ($logoutExitCode -ne 0) {
                      Write-Warning "fcli SSC logout returned exit code $logoutExitCode."
                  }
                  else {
                      Write-Host "SSC logout successful."
                  }
              }
          }

      # ============================================================
      # 7. NO CHANGED FILES
      # ============================================================

      - name: Skip Scan When No Files Changed
        if: steps.changed-files.outputs.any_changed != 'true'
        shell: powershell
        run: |
          Write-Host "No changed files were detected."
          Write-Host "Fortify ScanCentral SAST submission was skipped."

      # ============================================================
      # 8. ARCHIVE SCANCENTRAL LOGS ON FAILURE
      # ============================================================

      - name: Save ScanCentral Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scancentral-logs
          path: |
            C:\Users\Administrator\AppData\Local\Fortify\scancentral-24.2.0\log
            ~/.fortify/scancentral/log
            ~/.fortify/log
            if-no-files-found: warn