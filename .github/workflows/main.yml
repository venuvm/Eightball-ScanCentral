name: Fortify ScanCentral SAST - Changed Files Only

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  Fortify-SAST:

    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Check Out Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2


      # For pull requests, checkout the actual PR head
      # instead of the GitHub-generated merge commit.
      - name: Checkout Pull Request Head
        if: ${{ github.event_name == 'pull_request' }}
        shell: powershell
        run: |
          git checkout HEAD^2


      # ============================================================
      # 2. IDENTIFY CHANGED FILES
      # ============================================================

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          separator: "|"


      # ============================================================
      # 3. DISPLAY CHANGED FILES
      # ============================================================

      - name: Display Changed Files
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: powershell
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

        run: |

          Write-Host "=============================================="
          Write-Host " CHANGED FILES"
          Write-Host "=============================================="

          $changedFiles = @(
              $env:CHANGED_FILES -split '\|' |
              ForEach-Object {
                  $_.Trim().Trim('"')
              } |
              Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_)
              }
          )

          foreach ($file in $changedFiles) {
              Write-Host "Changed: $file"
          }


      # ============================================================
      # 4. SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ============================================================
      # 5. SETUP FORTIFY SCANCENTRAL CLIENT
      # ============================================================

      - name: Setup Fortify ScanCentral Client
        uses: fortify/gha-setup-scancentral-client@v2.3.0

        with:
          version: 24.2.0
          client-auth-token: ${{ secrets.CLIENT_AUTH_TOKEN }}


      # ============================================================
      # 6. CREATE CHANGED-FILE PACKAGE AND SUBMIT SCAN
      # ============================================================

      - name: Package Changed Files and Run Fortify ScanCentral SAST
        if: steps.changed-files.outputs.any_changed == 'true'

        shell: powershell

        env:

          SSC_URL: "https://fortify.cyberxdemo.com:8443/ssc"

          SSC_USER: "sscadmin"

          SSC_PASSWORD: "P@ssw0rd@123"

          SSC_CI_TOKEN: "15de0770-2c7b-4831-95c6-d7e4f6e2da58"

          SC_SAST_TOKEN: "CHANGEME321!"

          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}


        run: |

          $ErrorActionPreference = "Stop"


          # ========================================================
          # CONFIGURATION
          # ========================================================

          $workspace = $env:GITHUB_WORKSPACE

          $stagingDir = Join-Path `
              $env:RUNNER_TEMP `
              "fortify-changed-files"

          $packageFile = Join-Path `
              $env:RUNNER_TEMP `
              "package.zip"


          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FORTIFY CHANGED-FILE SCAN"
          Write-Host "=============================================="

          Write-Host "Workspace        : $workspace"
          Write-Host "Staging directory: $stagingDir"
          Write-Host "Package          : $packageFile"

          Write-Host ""


          # ========================================================
          # 1. VALIDATE CHANGED FILES
          # ========================================================

          if ([string]::IsNullOrWhiteSpace($env:CHANGED_FILES)) {

              Write-Host "No changed files found."

              Write-Host "Skipping Fortify scan."

              exit 0
          }


          # ========================================================
          # 2. PARSE CHANGED FILES
          # ========================================================

          $changedFiles = @(

              $env:CHANGED_FILES -split '\|' |

              ForEach-Object {

                  $_.Trim().Trim('"')

              } |

              Where-Object {

                  -not [string]::IsNullOrWhiteSpace($_)

              } |

              Select-Object -Unique
          )


          if ($changedFiles.Count -eq 0) {

              Write-Host "No valid changed files found."

              exit 0
          }


          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CHANGED FILES RETURNED BY GITHUB"
          Write-Host "=============================================="


          foreach ($file in $changedFiles) {

              Write-Host "  $file"

          }


          # ========================================================
          # 3. CLEAN OLD STAGING DIRECTORY
          # ========================================================

          Write-Host ""
          Write-Host "Preparing staging directory..."


          if (Test-Path -LiteralPath $stagingDir) {

              Remove-Item `
                  -LiteralPath $stagingDir `
                  -Recurse `
                  -Force
          }


          New-Item `
              -ItemType Directory `
              -Path $stagingDir `
              -Force |
              Out-Null


          # ========================================================
          # 4. REMOVE PREVIOUS PACKAGE
          # ========================================================

          if (Test-Path -LiteralPath $packageFile) {

              Remove-Item `
                  -LiteralPath $packageFile `
                  -Force
          }


          # ========================================================
          # 5. COPY ONLY CHANGED FILES
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " COPYING CHANGED FILES"
          Write-Host "=============================================="


          $copiedFiles = [System.Collections.Generic.List[string]]::new()

          $skippedFiles = [System.Collections.Generic.List[string]]::new()


          foreach ($relativeFile in $changedFiles) {


              # GitHub paths normally use "/".
              # Convert them to Windows paths.

              $windowsRelativeFile = $relativeFile.Replace(
                  '/',
                  [System.IO.Path]::DirectorySeparatorChar
              )


              $sourcePath = Join-Path `
                  $workspace `
                  $windowsRelativeFile


              $destinationPath = Join-Path `
                  $stagingDir `
                  $windowsRelativeFile


              # ----------------------------------------------------
              # Deleted files are reported as changed but no longer
              # exist in the checked-out repository.
              # ----------------------------------------------------

              if (-not (
                  Test-Path `
                      -LiteralPath $sourcePath `
                      -PathType Leaf
              )) {

                  Write-Warning "Skipping deleted/missing file: $relativeFile"

                  $skippedFiles.Add($relativeFile)

                  continue
              }


              # ----------------------------------------------------
              # Preserve original source directory structure.
              #
              # Example:
              #
              # src/main/java/com/company/Test.java
              #
              # becomes:
              #
              # fortify-changed-files\
              #   src\
              #     main\
              #       java\
              #         com\
              #           company\
              #             Test.java
              # ----------------------------------------------------

              $destinationParent = Split-Path `
                  -Path $destinationPath `
                  -Parent


              if (-not (
                  Test-Path -LiteralPath $destinationParent
              )) {

                  New-Item `
                      -ItemType Directory `
                      -Path $destinationParent `
                      -Force |
                      Out-Null
              }


              Copy-Item `
                  -LiteralPath $sourcePath `
                  -Destination $destinationPath `
                  -Force


              $copiedFiles.Add($relativeFile)


              Write-Host "Included: $relativeFile"
          }


          # ========================================================
          # 6. VERIFY THAT SOMETHING WAS COPIED
          # ========================================================

          if ($copiedFiles.Count -eq 0) {

              Write-Host ""
              Write-Host "No existing changed files available to scan."

              Write-Host "The commit may contain only deleted files."

              Write-Host "Skipping Fortify scan."

              exit 0
          }


          Write-Host ""

          Write-Host "Changed files copied: $($copiedFiles.Count)"

          Write-Host "Deleted/missing files skipped: $($skippedFiles.Count)"


          # ========================================================
          # 7. DISPLAY FINAL STAGING CONTENTS
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL FILES GOING INTO PACKAGE"
          Write-Host "=============================================="


          Get-ChildItem `
              -LiteralPath $stagingDir `
              -File `
              -Recurse |

          ForEach-Object {

              $relativePath = [System.IO.Path]::GetRelativePath(
                  $stagingDir,
                  $_.FullName
              )

              Write-Host "  $relativePath"
          }


          # ========================================================
          # 8. CREATE SCANCENTRAL PACKAGE
          #
          # IMPORTANT:
          #
          # We run "scancentral package" from the staging directory.
          #
          # Therefore ScanCentral sees ONLY the changed files.
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING SCANCENTRAL PACKAGE"
          Write-Host "=============================================="


          Push-Location $stagingDir


          try {

              & scancentral package `
                  -o "$packageFile"


              $packageExitCode = $LASTEXITCODE


              if ($packageExitCode -ne 0) {

                  throw "ScanCentral package failed. Exit code: $packageExitCode"

              }

          }

          finally {

              Pop-Location

          }


          # ========================================================
          # 9. VALIDATE PACKAGE
          # ========================================================

          if (-not (
              Test-Path `
                  -LiteralPath $packageFile `
                  -PathType Leaf
          )) {

              throw "ScanCentral package was not created: $packageFile"

          }


          $packageInfo = Get-Item `
              -LiteralPath $packageFile


          $packageSizeMB = [Math]::Round(
              $packageInfo.Length / 1MB,
              2
          )


          Write-Host ""
          Write-Host "=============================================="
          Write-Host " PACKAGE CREATED"
          Write-Host "=============================================="

          Write-Host "Package            : $packageFile"

          Write-Host "Package size       : $packageSizeMB MB"

          Write-Host "Changed files      : $($copiedFiles.Count)"

          Write-Host "Deleted files      : $($skippedFiles.Count)"


          # ========================================================
          # 10. VALIDATE CREDENTIALS
          # ========================================================

          if ([string]::IsNullOrWhiteSpace($env:SSC_URL)) {

              throw "        if (:IsNullOrWhiteSpace($env:SSC_USER)) {

              throw "SSC_USER secret is empty."

          }


          if (:IsNullOrWhiteSpace($env:SSC_PASSWORD)) {

              throw "SSC_PASSWORD secret is empty."

          }


          if (:IsNullOrWhiteSpace($env:SSC_CI_TOKEN)) {

              throw "SSC_CI_TOKEN secret is empty."

          }


          if (:IsNullOrWhiteSpace($env:SC_SAST_TOKEN)) {

              throw "SC_SAST_TOKEN secret is empty."

          }


          # ========================================================
          # 11. LOGIN TO SSC / SCANCENTRAL
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " LOGIN TO SSC"
          Write-Host "=============================================="


          & fcli ssc session login `
              --url "$env:SSC_URL" `
              -u "$env:SSC_USER" `
              -p "$env:SSC_PASSWORD" `
              -c "$env:SC_SAST_TOKEN"


          $loginExitCode = $LASTEXITCODE


          if ($loginExitCode -ne 0) {

              throw "fcli SSC login failed. Exit code: $loginExitCode"

          }


          Write-Host "SSC login successful."


          # ========================================================
          # 12. SUBMIT SCANCENTRAL SAST SCAN
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " SUBMITTING SCANCENTRAL SAST SCAN"
          Write-Host "=============================================="


          Write-Host "Package:"
          Write-Host $packageFile

          Write-Host ""

          Write-Host "Files included in this scan:"


          foreach ($file in $copiedFiles) {

              Write-Host "  $file"

          }


          Write-Host ""
          Write-Host "Submitting scan..."


          & fcli sc-sast scan start `
              --file="$packageFile" `
              --publish-to "fcli:1" `
              --publish-token "$env:SSC_CI_TOKEN"


          $scanExitCode = $LASTEXITCODE


          if ($scanExitCode -ne 0) {

              throw "ScanCentral scan submission failed. Exit code: $scanExitCode"

          }


          # ========================================================
          # 13. SUCCESS
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FORTIFY SCAN SUBMITTED SUCCESSFULLY"
          Write-Host "=============================================="

          Write-Host ""

          Write-Host "Changed files packaged: $($copiedFiles.Count)"

          Write-Host "Package: $packageFile"

          Write-Host ""

          Write-Host "ScanCentral SAST job submitted successfully."


      # ============================================================
      # 7. ARCHIVE SCANCENTRAL LOGS ON FAILURE
      # ============================================================

      - name: Save ScanCentral Logs
        if: failure()

        uses: actions/upload-artifact@v4

        with:
          name: scancentral-logs
          path: ~/.fortify/scancentral/log
